# Render Blueprint — deploys the API as a Web Service.
# Render dashboard → Blueprints → New Blueprint Instance → point at this repo.
# Every `sync: false` value must be filled in from the Render dashboard; none of
# them are ever committed.
services:
  - type: web
    name: shopsphere-api
    runtime: node
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: /api/v1

      # Secrets — set these in the Render dashboard, never in this file.
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ecommerce_db
      - key: USE_MEMORY_DB
        value: "false"
      - key: JWT_SECRET
        generateValue: true # Render generates a strong secret on first deploy
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      # The deployed Vercel URL — this is the only origin CORS will accept.
      - key: CLIENT_URL
        sync: false
      - key: ADDITIONAL_CORS_ORIGINS
        sync: false

      # Optional SMTP for password-reset emails.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: EMAIL_FROM
        sync: false

      - key: JWT_EXPIRES_IN
        value: 7d
      - key: BCRYPT_SALT_ROUNDS
        value: "12"
      - key: CLOUDINARY_FOLDER
        value: ecommerce/products
      - key: FREE_SHIPPING_THRESHOLD
        value: "999"
      - key: SHIPPING_FEE
        value: "49"
      - key: TAX_RATE
        value: "0.05"
