<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f7fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c101e" media="(prefers-color-scheme: dark)" />
    <script>
      // Apply the saved theme before the first paint so there is no flash.
      // Mirrors ThemeContext: "light" | "dark" in localStorage, else the OS setting.
      (function () {
        try {
          var saved = localStorage.getItem('shopsphere.theme');
          var dark = saved === 'dark' || (saved !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
    <meta
      name="description"
      content="ShopSphere — a modern online store for electronics, fashion, home, fitness, books and beauty."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>ShopSphere — Shop smarter</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
